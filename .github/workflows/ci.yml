name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      # Integration tests start real PostgreSQL 16 and Redis 7 with Testcontainers (Docker is available on the runner).
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build   # tsc -b (strict type-check) + vite build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          sed -i "s/^FLOWGRID_JWT_SECRET=.*/FLOWGRID_JWT_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: Run a workflow end to end through nginx
        run: |
          TOKEN=$(curl -fsS -X POST localhost:8088/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"email":"operator@acme.test","password":"flowgrid-demo"}' | jq -r .token)
          curl -fsS -X POST localhost:8088/api/v1/demo/claims -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d '{"count":5}'
          for i in $(seq 1 60); do
            DONE=$(curl -fsS "localhost:8088/api/v1/executions?status=SUCCEEDED" -H "authorization: Bearer $TOKEN" | jq .total)
            [ "$DONE" -ge 5 ] && echo "5 claims processed" && exit 0; sleep 1
          done
          exit 1
      - if: always()
        run: docker compose ps && docker compose logs --tail=100 && docker compose down -v
